# ALTA's gateway uses only Node built-ins. Retained upstream packages are not
# part of ALTA's install graph; build the Codex App Server through Cargo/`./alta build`.
packages:
  - alta-dashboard

# Keep the install layout deterministic across operator machines.  In
# particular, do not inherit a user's global `node-linker=hoisted` setting:
# that can leave workspace-local executable links pointing at a missing
# virtual store and make the one-command dashboard bootstrap fail.
nodeLinker: isolated
shamefullyHoist: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - fast-uri@3.1.6
  - qs@6.16.0

overrides:
  fast-uri: 3.1.6
  qs: 6.16.0

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
