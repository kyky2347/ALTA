version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      node-dependencies:
        patterns:
          - "*"
    reviewers:
      - kyky2347

  - package-ecosystem: uv
    directory: /alta-runtime/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      opportunity-os-dependencies:
        patterns:
          - "*"
    reviewers:
      - kyky2347

  - package-ecosystem: uv
    directory: /alta-runtime/capital-python
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      capital-boundary-dependencies:
        patterns:
          - "*"
    reviewers:
      - kyky2347

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
    reviewers:
      - kyky2347
