[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alta-brokers"
version = "0.1.0"
description = "Isolated, account-bound brokerage connectors for ALTA research"
requires-python = "==3.12.*"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3"]

[project.optional-dependencies]
tiger = ["tigeropen==3.7.0"]
futu = ["futu-api>=9.4,<11"]
longport = ["longport>=3,<5"]
ibkr = ["ib_async>=2,<3"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/alta_brokers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
