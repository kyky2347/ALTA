name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run Node tests
        run: ./alta test
      - name: Check formatting and Markdown
        run: corepack pnpm check

  python:
    name: Python and deterministic services
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # ALTA pins Python 3.12.13. Use a uv release whose managed-Python
          # catalogue includes that patch release so clean Linux runners and
          # local installations resolve the same interpreter.
          version: "0.12.3"
      - name: Prepare locked research runtime
        run: ./alta env setup --dev
      - name: Run Opportunity OS tests
        run: ./alta env python -m pytest -q alta-runtime/python/tests
      - name: Check Opportunity OS formatting and lint
        run: |
          ./alta env python -m ruff check alta-runtime/python/src alta-runtime/python/tests
          ./alta env python -m ruff format --check alta-runtime/python/src alta-runtime/python/tests
      - name: Run isolated Paper-boundary tests
        run: uv run --frozen --project alta-runtime/capital-python pytest -q alta-runtime/capital-python/tests
      - name: Stop managed services
        if: always()
        run: ./alta env down || true
